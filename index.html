<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="免费多语言单位换算器：长度、重量、面积、体积、汇率和温度。">
  <title>Convertly - Universal Unit Converter</title>
  <style>
    :root{--ink:#182725;--muted:#64716e;--teal:#118c83;--teal-dark:#08766e;--cream:#fbf8f1;--line:#e8dfd1;--card:#fffdfa}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% 12%,#fff 0,#fbf8f1 50%,#f8f3e9 100%);color:var(--ink);font-family:Arial,"Noto Sans SC","Noto Sans JP",sans-serif}.wrap{width:min(1180px,calc(100% - 48px));margin:auto}
    .nav{height:92px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px;font-size:25px;font-weight:800;color:var(--ink);text-decoration:none}.brand>span{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;font-size:27px;background:linear-gradient(145deg,#0d9a90,#0b766f);box-shadow:0 8px 20px #168e8127}.nav nav{display:flex;gap:42px}.nav nav a{color:#34413f;text-decoration:none;font-weight:600}.nav nav a:hover{color:var(--teal)}.language{height:48px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);border-radius:14px;background:#fffaf4;box-shadow:0 6px 18px #634a2810}.language span{font-size:22px}.language select{border:0;background:transparent;font-weight:700;color:var(--ink);outline:0;font-size:15px}
    .hero{text-align:center;padding:60px 0 40px}.eyebrow,.section-title p{font-size:11px!important;letter-spacing:.18em;font-weight:800;color:var(--teal)!important;margin:0 0 12px!important}.hero h1{font-size:55px;letter-spacing:-.045em;margin:0 0 12px;line-height:1.08}.hero>p:not(.eyebrow){font-size:19px;color:var(--muted);margin:0}
    .workspace{padding-top:12px}.tabs{height:68px;display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--line);border-radius:18px 18px 0 0;background:#fffaf5;overflow:hidden}.tabs button{border:0;border-right:1px solid var(--line);background:transparent;font-size:15px;font-weight:700;color:#3b4745;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:.2s}.tabs button:last-child{border-right:0}.tabs button i{font-style:normal;font-size:20px;color:#df9e16}.tabs button:hover{background:#f2eee4}.tabs button.active{color:#fff;background:linear-gradient(145deg,#159b91,#0b7f77)}.tabs button.active i{color:#fff}
    .converter-card{background:rgba(255,253,250,.94);border:1px solid var(--line);border-top:0;border-radius:0 0 20px 20px;padding:30px 34px 22px;box-shadow:0 18px 50px #694f2812}.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.card-head>div{display:flex;align-items:center;gap:11px}.card-head h2{font-size:22px;margin:0}.mini-icon{width:34px;height:34px;display:grid;place-items:center;color:var(--teal);background:#dcf1eb;border-radius:10px;font-weight:800}.status{font-size:13px;color:var(--muted)}.status b{display:inline-block;width:8px;height:8px;background:#5eab49;border-radius:50%;margin-right:8px;box-shadow:0 0 0 4px #5eab4917}
    .convert-grid{display:grid;grid-template-columns:1fr 58px 1fr;align-items:end;gap:22px}.convert-grid label>span{display:block;font-size:13px;font-weight:700;color:#56625f;margin-bottom:8px}.field{display:grid;grid-template-columns:minmax(90px,1fr) minmax(160px,.85fr);border:1px solid #cfc6b9;border-radius:13px;background:#fff;overflow:hidden;transition:.2s}.field:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px #118c8318}.field input,.field select{height:58px;border:0;background:transparent;padding:0 16px;color:var(--ink);outline:0}.field input{font-size:25px;font-weight:800;min-width:0}.field select{border-left:1px solid var(--line);font-size:14px;font-weight:600}.result{background:#faf8f2}.swap{width:54px;height:54px;border:0;border-radius:50%;background:linear-gradient(145deg,#19a096,#097870);color:white;font-size:25px;cursor:pointer;box-shadow:0 9px 20px #08766e2f;transition:.25s}.swap:hover{transform:rotate(180deg) scale(1.05)}
    .result-line{margin-top:25px;border-top:1px solid var(--line);padding:22px 0 16px;text-align:center;font-size:24px}.result-line span{color:#8b938f;margin:0 12px}.card-foot{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.card-foot button{border:0;background:transparent;color:var(--teal-dark);font-weight:800;cursor:pointer;padding:8px 0}
    .common{padding:38px 0 80px}.section-title{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}.section-title h2{font-size:22px;margin:0}.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.quick-grid article{background:#fffdf9;border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;align-items:center;gap:13px;box-shadow:0 8px 22px #684d2310;transition:.2s}.quick-grid article:hover{transform:translateY(-3px)}.quick-grid article>span{margin-left:auto}.quick-grid article div{display:flex;flex-direction:column;gap:5px}.quick-grid b{font-size:14px}.quick-grid small{color:var(--muted)}.dot{width:12px;height:12px;border-radius:50%;background:#168f86;box-shadow:0 0 0 5px #168f8615}.d1{background:#78b961}.d2{background:#559be0}.d3{background:#e1a729}
    footer{border-top:1px solid var(--line);background:#f4eee3;padding:35px 0}footer .wrap{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:30px}footer .brand{font-size:20px}footer .brand span{width:36px;height:36px;font-size:20px;border-radius:10px}footer p,footer small{color:var(--muted);font-size:13px}footer small{text-align:right}
    @media(max-width:850px){.nav nav{display:none}.hero{padding:38px 0 30px}.hero h1{font-size:42px}.tabs{grid-template-columns:repeat(3,1fr);height:auto;border-radius:18px}.tabs button{height:58px;border-bottom:1px solid var(--line)}.converter-card{border-top:1px solid var(--line);border-radius:20px;margin-top:12px}.convert-grid{grid-template-columns:1fr}.swap{margin:auto;transform:rotate(90deg)}.quick-grid{grid-template-columns:repeat(2,1fr)}footer .wrap{grid-template-columns:1fr;text-align:center}footer .brand{justify-content:center}footer small{text-align:center}}
    @media(max-width:560px){.wrap{width:min(100% - 28px,1180px)}.nav{height:76px}.brand{font-size:21px}.brand>span{width:42px;height:42px}.language{padding:0 8px}.language span{display:none}.hero h1{font-size:35px}.hero>p:not(.eyebrow){font-size:16px}.tabs{grid-template-columns:repeat(2,1fr)}.tabs button{font-size:13px}.converter-card{padding:24px 17px 18px}.card-head{align-items:flex-start;gap:12px}.status{max-width:125px;text-align:right}.field{grid-template-columns:1fr}.field select{border-left:0;border-top:1px solid var(--line)}.result-line{font-size:19px}.card-foot{align-items:flex-start;gap:12px}.card-foot span{text-align:right}.quick-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="nav wrap">
    <a class="brand" href="#top"><span>⇄</span>Convertly</a>
    <nav><a href="#converter" data-i="all"></a><a href="#popular" data-i="popular"></a><a href="#about" data-i="about"></a></nav>
    <label class="language"><span>◎</span><select id="language" aria-label="Language"><option value="en">English</option><option value="zh-CN" selected>简体中文</option><option value="zh-TW">繁體中文</option><option value="ja">日本語</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="es">Español</option><option value="ko">한국어</option></select></label>
  </header>
  <section class="hero wrap" id="top"><p class="eyebrow">UNIVERSAL UNIT CONVERTER</p><h1 data-i="title"></h1><p data-i="sub"></p></section>
  <section class="workspace wrap" id="converter">
    <div class="tabs" id="tabs"></div>
    <div class="converter-card">
      <div class="card-head"><div><span class="mini-icon" id="miniIcon">↔</span><h2 id="converterTitle"></h2></div><span class="status"><b></b><span id="statusText"></span></span></div>
      <div class="convert-grid">
        <label><span data-i="from"></span><div class="field"><input id="inputValue" inputmode="decimal" value="1"><select id="fromUnit"></select></div></label>
        <button class="swap" id="swap" aria-label="Swap units">⇄</button>
        <label><span data-i="to"></span><div class="field result"><input id="resultValue" readonly><select id="toUnit"></select></div></label>
      </div>
      <div class="result-line"><strong id="leftResult"></strong><span>=</span><strong id="rightResult"></strong></div>
      <div class="card-foot"><button id="copyButton">▣ <span data-i="copy"></span></button><span id="disclaimer"></span></div>
    </div>
  </section>
  <section class="common wrap" id="popular"><div class="section-title"><div><p>QUICK REFERENCE</p><h2 data-i="common"></h2></div><span>→</span></div><div class="quick-grid" id="quickGrid"></div></section>
  <footer id="about"><div class="wrap"><div class="brand"><span>⇄</span>Convertly</div><p data-i="sub"></p><small>© 2026 Convertly · Clear calculations for everyone.</small></div></footer>
  <script>
  (()=>{
    const texts={
      en:{title:'Convert anything, instantly.',sub:'Fast, accurate unit conversions for everyday life.',all:'All converters',popular:'Popular',about:'About',from:'From',to:'To',common:'Common conversions',copy:'Copy result',copied:'Copied!',updated:'Instant calculation',reference:'Indicative reference rates · not live',disclaimer:'Currency results are estimates and may differ from bank rates.',categories:['Length','Weight','Area','Volume','Currency','Temperature'],converter:'Converter'},
      'zh-CN':{title:'快速换算，一步完成。',sub:'为日常生活提供快速、准确的单位换算。',all:'全部换算',popular:'常用换算',about:'关于',from:'从',to:'换算为',common:'常用换算',copy:'复制结果',copied:'已复制！',updated:'即时计算',reference:'参考汇率 · 非实时数据',disclaimer:'汇率结果仅供参考，可能与银行实际汇率不同。',categories:['长度','重量','面积','体积','汇率','温度'],converter:'换算器'},
      'zh-TW':{title:'快速換算，一步完成。',sub:'為日常生活提供快速、準確的單位換算。',all:'全部換算',popular:'常用換算',about:'關於',from:'從',to:'換算為',common:'常用換算',copy:'複製結果',copied:'已複製！',updated:'即時計算',reference:'參考匯率 · 非即時資料',disclaimer:'匯率結果僅供參考，可能與銀行實際匯率不同。',categories:['長度','重量','面積','體積','匯率','溫度'],converter:'換算器'},
      ja:{title:'あらゆる単位を、すぐに変換。',sub:'毎日のための高速で正確な単位換算。',all:'すべての換算',popular:'よく使う換算',about:'概要',from:'変換元',to:'変換先',common:'よく使う換算',copy:'結果をコピー',copied:'コピーしました！',updated:'リアルタイム計算',reference:'参考レート・リアルタイムではありません',disclaimer:'為替結果は目安で、銀行レートと異なる場合があります。',categories:['長さ','重さ','面積','体積','通貨','温度'],converter:'換算'},
      fr:{title:'Convertissez tout, instantanément.',sub:'Des conversions rapides et précises au quotidien.',all:'Tous les convertisseurs',popular:'Populaires',about:'À propos',from:'De',to:'Vers',common:'Conversions courantes',copy:'Copier le résultat',copied:'Copié !',updated:'Calcul instantané',reference:'Taux indicatifs · non actualisés',disclaimer:'Les résultats de change sont des estimations.',categories:['Longueur','Poids','Surface','Volume','Devise','Température'],converter:'Convertisseur'},
      de:{title:'Alles sofort umrechnen.',sub:'Schnelle, präzise Umrechnungen für den Alltag.',all:'Alle Umrechner',popular:'Beliebt',about:'Über uns',from:'Von',to:'In',common:'Häufige Umrechnungen',copy:'Ergebnis kopieren',copied:'Kopiert!',updated:'Sofortberechnung',reference:'Richtkurse · nicht live',disclaimer:'Währungsergebnisse sind Schätzwerte.',categories:['Länge','Gewicht','Fläche','Volumen','Währung','Temperatur'],converter:'Umrechner'},
      es:{title:'Convierte cualquier cosa al instante.',sub:'Conversiones rápidas y precisas para cada día.',all:'Conversores',popular:'Populares',about:'Acerca de',from:'De',to:'A',common:'Conversiones comunes',copy:'Copiar resultado',copied:'¡Copiado!',updated:'Cálculo instantáneo',reference:'Tasas indicativas · no en vivo',disclaimer:'Los resultados de divisas son estimaciones.',categories:['Longitud','Peso','Área','Volumen','Moneda','Temperatura'],converter:'Conversor'},
      ko:{title:'무엇이든 즉시 변환하세요.',sub:'일상을 위한 빠르고 정확한 단위 변환.',all:'모든 변환',popular:'인기',about:'소개',from:'변환 전',to:'변환 후',common:'자주 쓰는 변환',copy:'결과 복사',copied:'복사됨!',updated:'즉시 계산',reference:'참고 환율 · 실시간 아님',disclaimer:'환율 결과는 추정치이며 은행 환율과 다를 수 있습니다.',categories:['길이','무게','면적','부피','통화','온도'],converter:'변환기'}
    };
    const name=(en,zh,ja)=>({en,'zh-CN':zh,'zh-TW':zh,ja,fr:en,de:en,es:en,ko:en});
    const units={
      length:[['m','m',1,name('Meter','米','メートル')],['km','km',1000,name('Kilometer','千米','キロメートル')],['cm','cm',.01,name('Centimeter','厘米','センチメートル')],['mm','mm',.001,name('Millimeter','毫米','ミリメートル')],['mi','mi',1609.344,name('Mile','英里','マイル')],['yd','yd',.9144,name('Yard','码','ヤード')],['ft','ft',.3048,name('Foot','英尺','フィート')],['in','in',.0254,name('Inch','英寸','インチ')]],
      weight:[['kg','kg',1,name('Kilogram','千克','キログラム')],['g','g',.001,name('Gram','克','グラム')],['mg','mg',.000001,name('Milligram','毫克','ミリグラム')],['t','t',1000,name('Metric ton','公吨','トン')],['lb','lb',.45359237,name('Pound','磅','ポンド')],['oz','oz',.028349523125,name('Ounce','盎司','オンス')]],
      area:[['sqm','m²',1,name('Square meter','平方米','平方メートル')],['sqkm','km²',1e6,name('Square kilometer','平方千米','平方キロメートル')],['sqft','ft²',.09290304,name('Square foot','平方英尺','平方フィート')],['sqin','in²',.00064516,name('Square inch','平方英寸','平方インチ')],['acre','ac',4046.8564224,name('Acre','英亩','エーカー')],['hectare','ha',10000,name('Hectare','公顷','ヘクタール')]],
      volume:[['l','L',1,name('Liter','升','リットル')],['ml','mL',.001,name('Milliliter','毫升','ミリリットル')],['cbm','m³',1000,name('Cubic meter','立方米','立方メートル')],['gal','US gal',3.785411784,name('US gallon','美制加仑','米ガロン')],['qt','US qt',.946352946,name('US quart','美制夸脱','米クォート')],['cup','US cup',.2365882365,name('US cup','美制杯','米カップ')]],
      currency:[['usd','USD',1,name('US Dollar','美元','米ドル')],['eur','EUR',1/.86,name('Euro','欧元','ユーロ')],['jpy','JPY',1/158,name('Japanese Yen','日元','日本円')],['cny','CNY',1/7.18,name('Chinese Yuan','人民币','中国人民元')],['gbp','GBP',1/.74,name('British Pound','英镑','英ポンド')],['cad','CAD',1/1.37,name('Canadian Dollar','加元','カナダドル')],['sgd','SGD',1/1.28,name('Singapore Dollar','新加坡元','シンガポールドル')],['chf','CHF',1/.79,name('Swiss Franc','瑞士法郎','スイスフラン')]],
      temperature:[['c','°C',null,name('Celsius','摄氏度','摂氏')],['f','°F',null,name('Fahrenheit','华氏度','華氏')],['k','K',null,name('Kelvin','开尔文','ケルビン')]]
    };
    const ids=['length','weight','area','volume','currency','temperature'],icons=['↔','●','▦','◇','$','♨'];
    const defaults={length:['m','ft'],weight:['kg','lb'],area:['sqm','sqft'],volume:['l','gal'],currency:['usd','eur'],temperature:['c','f']};
    const quick={length:[['1 km','0.621371 mi'],['1 in','2.54 cm'],['1 ft','30.48 cm'],['1 mi','1.60934 km']],weight:[['1 kg','2.20462 lb'],['1 lb','453.592 g'],['1 oz','28.3495 g'],['1 t','1000 kg']],area:[['1 m²','10.7639 ft²'],['1 acre','4046.86 m²'],['1 ha','2.47105 ac'],['1 km²','100 ha']],volume:[['1 L','0.264172 gal'],['1 gal','3.78541 L'],['1 cup','236.588 mL'],['1 m³','1000 L']],temperature:[['0 °C','32 °F'],['100 °C','212 °F'],['20 °C','68 °F'],['0 K','−273.15 °C']],currency:[['1 USD','0.86 EUR'],['1 USD','158 JPY'],['1 USD','7.18 CNY'],['1 USD','1.37 CAD']]};
    let lang='zh-CN',category='length';const $=s=>document.querySelector(s);
    function convert(v,a,b){if(category==='temperature'){let c=a[0]==='c'?v:a[0]==='f'?(v-32)*5/9:v-273.15;return b[0]==='c'?c:b[0]==='f'?c*9/5+32:c+273.15}return v*a[2]/b[2]}
    const fmt=v=>Number.isFinite(v)?new Intl.NumberFormat(lang,{maximumFractionDigits:8}).format(v):'—';
    function current(){const list=units[category],a=list.find(x=>x[0]===$('#fromUnit').value)||list[0],b=list.find(x=>x[0]===$('#toUnit').value)||list[1];return{a,b,v:Number($('#inputValue').value),r:convert(Number($('#inputValue').value),a,b)}}
    function calculate(){const x=current();$('#resultValue').value=fmt(x.r);$('#leftResult').textContent=`${$('#inputValue').value||0} ${x.a[1]}`;$('#rightResult').textContent=`${fmt(x.r)} ${x.b[1]}`}
    function fillUnits(){const list=units[category],d=defaults[category];['fromUnit','toUnit'].forEach((id,i)=>{$('#'+id).innerHTML=list.map(u=>`<option value="${u[0]}">${u[3][lang]||u[3].en} (${u[1]})</option>`).join('');$('#'+id).value=d[i]});calculate()}
    function render(){const t=texts[lang];document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t[el.dataset.i]);$('#tabs').innerHTML=ids.map((id,i)=>`<button data-category="${id}" class="${id===category?'active':''}"><i>${icons[i]}</i>${t.categories[i]}</button>`).join('');$('#converterTitle').textContent=`${t.categories[ids.indexOf(category)]} ${t.converter}`;$('#miniIcon').textContent=icons[ids.indexOf(category)];$('#statusText').textContent=category==='currency'?t.reference:t.updated;$('#disclaimer').textContent=category==='currency'?t.disclaimer:t.updated;$('#quickGrid').innerHTML=quick[category].map((q,i)=>`<article><i class="dot d${i}"></i><div><b>${q[0]}</b><small>= ${q[1]}</small></div><span>→</span></article>`).join('');fillUnits();$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{category=b.dataset.category;$('#inputValue').value='1';render()})}
    $('#language').onchange=e=>{lang=e.target.value;render()};$('#inputValue').oninput=calculate;$('#fromUnit').onchange=calculate;$('#toUnit').onchange=calculate;
    $('#swap').onclick=()=>{const x=current();$('#fromUnit').value=x.b[0];$('#toUnit').value=x.a[0];$('#inputValue').value=Number.isFinite(x.r)?Number(x.r.toPrecision(10)):1;calculate()};
    $('#copyButton').onclick=async()=>{const x=current(),t=texts[lang];try{await navigator.clipboard.writeText(`${$('#inputValue').value} ${x.a[1]} = ${fmt(x.r)} ${x.b[1]}`)}catch(e){}$('#copyButton span').textContent=t.copied;setTimeout(()=>$('#copyButton span').textContent=t.copy,1400)};
    render();
  })();
  </script>
</body>
</html>
